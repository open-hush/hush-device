[package]
name = "hush-device"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Hush contributors"]
description = "Firmware for the Hush RFID-activated audio device (XIAO ESP32-S3)."
repository = "https://github.com/open-hush/hush-device"
publish = false

[[bin]]
name = "hush-device"
path = "src/main.rs"
test = false
bench = false

# -----------------------------------------------------------------------------
# Dependencies — phase 1 rides the `esp-hal 1.0.0-beta.1` + `esp-hal-embassy
# 0.8.1` + `embassy 0.7` generation. The released `esp-hal 1.0` / `1.1.x` line
# dropped a private hook that `esp-hal-embassy 0.9.x` still references on
# crates.io, so newer tags don't actually compile together; bump again once a
# corrected `esp-hal-embassy` ships against `esp-hal 1.x` stable. All deps
# that belong to later phases (WiFi, BLE, TLS, JSON, crypto, NVS, SD, RFID,
# MP3) are commented out and re-enabled when their task lands.
# -----------------------------------------------------------------------------
[dependencies]
# Core HAL + async runtime.
esp-hal = { version = "=1.0.0-beta.1", features = ["esp32s3", "unstable"] }
esp-hal-embassy = { version = "=0.8.1", features = ["esp32s3"] }
esp-backtrace = { version = "0.15", features = ["esp32s3", "panic-handler", "exception-handler", "println"] }
esp-println = { version = "0.13", features = ["esp32s3", "log"] }
# Emits the ESP-IDF App Descriptor expected by the second-stage bootloader.
# Without the `esp_app_desc!()` invocation in `main.rs`, `espflash save-image`
# / `espflash flash` refuse the binary as "ESP-IDF App Descriptor missing".
esp-bootloader-esp-idf = "0.1"
embassy-executor = { version = "0.7", features = ["nightly", "task-arena-size-65536"] }
embassy-time = "0.4"
embassy-sync = "0.6"
embassy-futures = "0.1"

# PSRAM allocator. Activated as soon as main.rs comes up so any later `alloc`
# need (TLS, JSON parsing into a heapless overflow) is served from PSRAM.
esp-alloc = "0.6"

# Logging facade.
log = "0.4"

# Heapless data structures. Pulled in from day 1 because the event types in
# src/proto/events.rs use heapless::String etc.
heapless = { version = "0.8", features = ["serde"] }

# Serde — needed by the proto types below.
serde = { version = "1", default-features = false, features = ["derive"] }
serde-json-core = "0.5"

# embedded-hal traits — needed by the hw/ trait shims even before the SPI /
# I2S / SD bring-up lands.
embedded-hal = "1"
embedded-hal-async = "1"

# Static cells for one-shot 'static initialization of peripherals shared
# with embassy tasks. Pulled in transitively by esp-hal-embassy; we
# declare it explicitly to use it directly in main.rs for the LEDC
# timer + driver hand-off into the led task.
static_cell = "2"

# MFRC522 RFID reader driver — Phase 1.
# Default features pull embedded-hal 1.0; we leave them on. The crate
# itself pins `heapless 0.7` internally, which coexists with our
# `heapless 0.8` because we never pass heapless types across the
# boundary.
mfrc522 = "0.7"

# Embedded-hal-bus wraps a raw `SpiBus` plus a CS pin into the
# per-device `SpiDevice` trait that `mfrc522` and `embedded-sdmmc`
# both consume. `default-features = false` keeps `std`/`async`
# machinery out of the no_std build.
embedded-hal-bus = { version = "0.3", default-features = false }

# microSD over SPI (FAT32) — Phase 1.
# `default-features = false` drops the `defmt-log` feature; the `log`
# feature routes the driver's trace lines into our `esp-println` sink.
embedded-sdmmc = { version = "0.9", default-features = false, features = ["log"] }

# ---- Deferred to later phases (uncomment when the task lands) --------------
#
# Phase 2 — sync with backend:
#   esp-wifi      = { version = "...", features = ["esp32s3", "wifi", "ble", "esp-alloc"] }
#   embassy-net   = { version = "...", features = ["dhcpv4", "dns", "tcp"] }
#   reqwless      = { version = "...", default-features = false, features = ["embedded-tls"] }
#   embedded-tls  = { version = "...", default-features = false }
#   hmac          = { version = "0.12", default-features = false }
#   sha2          = { version = "0.10", default-features = false }
#   hex           = { version = "0.4",  default-features = false }
#   sequential-storage = "..."
#   esp-storage   = { version = "...", features = ["esp32s3"] }
#
# Phase 3 — audio cache on SD:
#   embedded-sdmmc = { version = "...", default-features = false }
#
# Phase 1 (last item) — audio playback:
#   mfrc522 = { version = "...", default-features = false }
#   minimp3-sys = "0.6"  # decoder choice taken; FFI to the public-domain C lib

[profile.release]
opt-level = "s"      # smaller binary = faster OTA, less RAM pressure
codegen-units = 1
lto = "fat"
debug = true         # keep debug info for backtraces; stripped by espflash on flash
overflow-checks = false

[profile.dev]
opt-level = 3        # ESP32 cannot run unoptimised embassy code at sane speeds
debug = true

# -----------------------------------------------------------------------------
# Host-side test target — used for unit-testing pure logic (no HAL) with
# `cargo test --features mock-hardware`.
# -----------------------------------------------------------------------------
[features]
default = []
mock-hardware = []

[dev-dependencies]
# Reserved for host-side tests in phase 1+
