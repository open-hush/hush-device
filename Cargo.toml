[package]
name = "hush-device"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Hush contributors"]
description = "Firmware for the Hush RFID-activated audio device (XIAO ESP32-S3)."
repository = "https://github.com/open-hush/hush-device"
publish = false

[lib]
# The lib is a minimal re-export surface for the pure-logic modules we
# want to test on the host (see `src/lib.rs`). It is `no_std` and never
# linked into the firmware binary — `main.rs` keeps its own `mod` tree
# unchanged. Without the `[lib]` entry, `cargo test --target
# x86_64-apple-darwin` has nothing to compile (the bin is `test = false`
# and is `no_std` + `no_main` anyway).
name = "hush_device"
path = "src/lib.rs"

[[bin]]
name = "hush-device"
path = "src/main.rs"
test = false
bench = false

# -----------------------------------------------------------------------------
# Dependencies — phase 1 rides the `esp-hal 1.0.0-beta.1` + `esp-hal-embassy
# 0.8.1` + `embassy 0.7` generation. The released `esp-hal 1.0` / `1.1.x` line
# dropped a private hook that `esp-hal-embassy 0.9.x` still references on
# crates.io, so newer tags don't actually compile together; bump again once a
# corrected `esp-hal-embassy` ships against `esp-hal 1.x` stable. All deps
# that belong to later phases (WiFi, BLE, TLS, JSON, crypto, NVS, SD, RFID,
# MP3) are commented out and re-enabled when their task lands.
#
# Cross-target split: the [dependencies] table below holds only crates that
# also compile on the host (so `cargo test --target x86_64-apple-darwin
# --lib` works against the host-testable surface in `src/lib.rs`). Anything
# tied to the Xtensa target — esp-hal & friends, embassy executor, the
# embedded HAL drivers — lives under
# `[target.'cfg(target_arch = "xtensa")'.dependencies]` so it never gets
# pulled into a host build (the esp-hal build script `panic!`s when it sees
# a host triple).
# -----------------------------------------------------------------------------
[dependencies]
# Logging facade. Pure, host-compatible.
log = "0.4"

# Heapless data structures. Pulled in from day 1 because the event types in
# src/proto/events.rs use heapless::String etc. The hmac module also uses
# heapless::String for the canonical-request and auth-header outputs.
heapless = { version = "0.8", features = ["serde"] }

# Serde — needed by the proto types below. `derive` + no_std.
serde = { version = "1", default-features = false, features = ["derive"] }
serde-json-core = "0.5"

# embedded-hal traits — pure trait crates, no_std and host-compatible.
embedded-hal = "1"
embedded-hal-async = "1"

# embedded-hal-bus wraps a raw `SpiBus` plus a CS pin into the per-device
# `SpiDevice` trait that `mfrc522` and `embedded-sdmmc` both consume.
# `default-features = false` keeps `std`/`async` machinery out of the
# no_std build. Pure logic so it compiles on the host too.
embedded-hal-bus = { version = "0.3", default-features = false }

# Static cells for one-shot 'static initialization. Pure logic, works on
# host too.
static_cell = "2"

# HMAC-SHA256 device-request signing — Phase 2. Pure `no_std` building
# blocks; the canonical-request format and clock-skew rules live in
# `hush-protocol/docs/auth.md`. `hmac::SimpleHmac<Sha256>` lets us keep
# the dependency footprint minimal (no `block-buffer`/`crypto-common`
# defaults pulling in alloc indirectly).
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }

# -----------------------------------------------------------------------------
# Xtensa-only deps — pulled in for the device firmware build only. None of
# these compile cleanly for the host triple (esp-hal's build.rs panics on
# any non-Xtensa target), and the lib defined in `src/lib.rs` does not
# reference them, so gating them by target keeps host tests fast and
# self-contained.
# -----------------------------------------------------------------------------
[target.'cfg(target_arch = "xtensa")'.dependencies]
# Core HAL + async runtime.
esp-hal = { version = "=1.0.0-beta.1", features = ["esp32s3", "unstable"] }
esp-hal-embassy = { version = "=0.8.1", features = ["esp32s3"] }
esp-backtrace = { version = "0.15", features = ["esp32s3", "panic-handler", "exception-handler", "println"] }
esp-println = { version = "0.13", features = ["esp32s3", "log"] }
# Emits the ESP-IDF App Descriptor expected by the second-stage bootloader.
# Without the `esp_app_desc!()` invocation in `main.rs`, `espflash save-image`
# / `espflash flash` refuse the binary as "ESP-IDF App Descriptor missing".
esp-bootloader-esp-idf = "0.1"
embassy-executor = { version = "0.7", features = ["nightly", "task-arena-size-65536"] }
embassy-time = "0.4"
embassy-sync = "0.6"
embassy-futures = "0.1"

# Shared SPI bus guard (v1 hardware) — Phase 1. The XIAO's 11 pads force the
# RFID reader and microSD onto ONE SPI bus; embedded-hal-bus's
# `CriticalSectionDevice` (already a dep) wraps it, guarded by this crate's
# critical-section `Mutex`.
critical-section = "1"

# Single WS2812 / NeoPixel status LED over the RMT peripheral — Phase 1 (v1
# replaced the 3-GPIO LEDC LED). `smart-leds` is the generic `SmartLedsWrite`
# trait + `RGB8`; `esp-hal-smartled` is the esp-hal RMT adapter.
# TODO(bench): pin these against `esp-hal 1.0.0-beta.1` the way `esp-wifi` was
# (see the note there). The crates.io release of `esp-hal-smartled` that links
# against beta.1 must be confirmed — it may need a git rev — and the
# `SmartLedsAdapter` channel type / buffer const in `hw/led.rs` verified with
# `cargo check`.
smart-leds = "0.4"
esp-hal-smartled = "0.15"

# PSRAM allocator. Activated as soon as main.rs comes up so any later `alloc`
# need (TLS, JSON parsing into a heapless overflow) is served from PSRAM.
# Pinned to 0.8 because esp-wifi 0.14 transitively depends on the same
# version and Cargo can't unify two `#[global_allocator]` macros. The
# bump also moves the `heap_allocator!` macro to the keyword-arg form
# (`heap_allocator!(size: …)`), which is reflected in main.rs.
esp-alloc = "0.8"

# MFRC522 RFID reader driver — Phase 1.
# Default features pull embedded-hal 1.0; we leave them on. The crate
# itself pins `heapless 0.7` internally, which coexists with our
# `heapless 0.8` because we never pass heapless types across the
# boundary.
mfrc522 = "0.7"

# microSD over SPI (FAT32) — Phase 1.
# `default-features = false` drops the `defmt-log` feature; the `log`
# feature routes the driver's trace lines into our `esp-println` sink.
embedded-sdmmc = { version = "0.9", default-features = false, features = ["log"] }

# WiFi STA bring-up — last code item of Phase 1.
# Pinned `=0.14.0` because that's the tag whose `esp-hal` requirement
# (`=1.0.0-beta.1`) and `xtensa-lx-rt 0.19` line actually link against
# our pins. The earlier `0.13.0` declared `^1.0.0-beta.0` for esp-hal
# but pulled `xtensa-lx-rt 0.18` (→ `xtensa-lx 0.10`), which conflicts
# with `esp-hal 1.0.0-beta.1`'s `xtensa-lx 0.11` via the `links =
# "xtensa-lx"` rule. 0.14 closes that gap. 0.15+ wants `esp-hal 1.x`
# stable, not for this generation.
# Default features (`builtin-scheduler`, `esp-alloc`) intentionally
# kept on. `log-04` (renamed from `log` mid-beta) routes esp-wifi's
# internal traces through our `log` 0.4 sink. The `ble` feature lands
# enabled by our `ble-improv` feature (see the [features] table).
esp-wifi = { version = "=0.14.0", features = ["esp32s3", "wifi", "log-04"] }

# ---- Phase 5 BLE Improv Wi-Fi — gated behind the `ble-improv` feature -------
#
# esp-wifi's `BleConnector` (turned on by the `ble` feature, which our
# `ble-improv` feature pulls in) already implements
# `bt_hci::transport::Transport`. `bt-hci`'s `ExternalController` lifts that
# transport into the `Controller` trait a GATT host stack consumes. Pinned to
# the same `0.3` line esp-wifi 0.14.0 depends on so the `Transport` /
# `Controller` traits resolve to one copy. Optional + off by default so the
# baseline device build carries none of the BLE stack; the pure Improv
# protocol core (`src/proto/improv.rs`) is host-tested regardless.
bt-hci = { version = "0.3", default-features = false, optional = true }

# Random source for `esp-wifi::init` (PHY calibration uses it). `esp-hal`
# exposes the trait, but the bound is satisfied by `esp_hal::rng::Rng`
# which is already part of the HAL — no extra crate needed beyond what's
# pulled in transitively above.

# ---- Phase 2 on-target I/O — gated behind the `phase2-io` feature ----------
#
# These crates back the flash-NVS persistence and the HTTPS/TLS transport.
# They are `optional` and only compiled under `--features phase2-io` so the
# default `cargo build --target xtensa-esp32s3-none-elf` keeps the Phase 1
# baseline green while we pin the exact versions for this finicky
# `esp-hal 1.0.0-beta.1` generation (see the esp-wifi pinning note above) and
# confirm the `reqwless` TLS API on the bench. The pure logic that drives
# them (wire types, NVS codec, request signing, outbox, trust anchors) is
# always compiled and host-tested — only the device I/O is behind the flag.
#
# embassy-net: IP stack (DHCPv4 + DNS + TCP) over the esp-wifi STA device.
embassy-net = { version = "0.6", features = ["dhcpv4", "dns", "tcp", "medium-ethernet"], optional = true }
# reqwless: minimal async HTTP/1.1 client; `embedded-tls` backend for HTTPS.
reqwless = { version = "0.13", default-features = false, features = ["embedded-tls"], optional = true }
# Internal-flash NVS: typed KV over a wear-levelled log in the `nvs` /
# `storage` partitions. esp-storage provides the NorFlash impl for the
# ESP32-S3 internal flash.
sequential-storage = { version = "4", optional = true }
esp-storage = { version = "0.5", features = ["esp32s3"], optional = true }
embedded-storage = { version = "0.3", optional = true }
# Async NorFlash trait `sequential-storage` v4 is generic over; `main` lifts
# the blocking `esp_storage::FlashStorage` into it via
# `embassy-embedded-hal`'s `BlockingAsync` adapter.
embedded-storage-async = { version = "0.4", optional = true }
embassy-embedded-hal = { version = "0.3", optional = true }

# ---- Deferred to later phases (uncomment when the task lands) --------------
#
# Phase 3 — audio cache on SD: already wired above (Phase 1 closed the
# bring-up). MP3 decoder:
#   minimp3-sys = "0.6"  # decoder choice taken; FFI to the public-domain C lib

[profile.release]
opt-level = "s"      # smaller binary = faster OTA, less RAM pressure
codegen-units = 1
lto = "fat"
debug = true         # keep debug info for backtraces; stripped by espflash on flash
overflow-checks = false

[profile.dev]
opt-level = 3        # ESP32 cannot run unoptimised embassy code at sane speeds
debug = true

# -----------------------------------------------------------------------------
# Host-side test target — used for unit-testing pure logic (no HAL) with
# `cargo test --features mock-hardware`.
# -----------------------------------------------------------------------------
[features]
default = []
mock-hardware = []
# On-target Phase 2 I/O: flash-NVS persistence + HTTPS/TLS transport. Off by
# default so the baseline device build needs none of the networking/flash
# crates; the bench bring-up turns it on. See the deps block above.
phase2-io = [
    "dep:embassy-net",
    "dep:reqwless",
    "dep:sequential-storage",
    "dep:esp-storage",
    "dep:embedded-storage",
    "dep:embedded-storage-async",
    "dep:embassy-embedded-hal",
]
# On-target Phase 5 BLE Improv Wi-Fi provisioning: turns on esp-wifi's BLE
# controller + the bt-hci HCI layer used to bring the radio up. Off by default
# for the same reason as `phase2-io` — the baseline build stays minimal and
# the BLE host-stack choice is still being pinned on the bench (see
# `docs/adr/0001-ble-host-stack.md`). The Improv protocol state machine is
# compiled and host-tested with or without this flag.
ble-improv = [
    "esp-wifi/ble",
    "dep:bt-hci",
]

[dev-dependencies]
# Reserved for host-side tests in phase 1+
