[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
# `cargo run` flashes the device and opens a serial monitor.
runner = "espflash flash --monitor --partition-table partitions.csv"

rustflags = [
    # esp-hal 1.0+ injects `linkall.x` + `rom-functions.x` via its own
    # `cargo:rustc-link-arg` directives; we no longer pass them manually.
    # Recent nightly turned `panic_immediate_abort` from a build-std feature
    # into a real panic strategy; opt into it here so the `-Z build-std`
    # rebuild of `core` produces abort semantics (smaller binary, no unwinder).
    "-Z", "unstable-options",
    "-C", "panic=immediate-abort",
    # `--no-gc-sections` is required for the current esp-hal 1.0.0-beta.1 +
    # esp32s3 PAC 0.32 pairing: the default `--gc-sections` collapses the
    # trailing PROVIDE aliases in the generated `device.x` and leaves the
    # tail of `__INTERRUPTS` undefined. Remove this once a corrected
    # esp-hal-embassy lands against esp-hal 1.1+ on crates.io. See PLAN.md
    # ("Phase 1 — blocked on upstream") for context.
    "-C", "link-arg=-Wl,--no-gc-sections",
]

[unstable]
build-std = ["alloc", "core"]

[env]
ESP_LOG = "info"
