[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
# `cargo run` flashes the device and opens a serial monitor.
runner = "espflash flash --monitor --partition-table partitions.csv"

rustflags = [
    # Linker scripts. esp-hal 1.0.0-beta.1 emits `linkall.x` (the umbrella
    # script that pulls in rom-functions.x, esp32s3-link.x, the interrupt
    # vector table and the xtensa-lx-rt symbols), but it does NOT auto-inject
    # it as a `-T` arg the way esp-hal 1.0 stable does — we must pass it
    # ourselves. Without this every xtensa-lx-rt symbol (`__exception`,
    # `__pre_init`, `_bss_end`, …) and every PAC peripheral alias
    # (`FROM_CPU_INTR0`, …) is undefined at link time.
    "-C", "link-arg=-Tlinkall.x",
    # `no_std` + `no_main` does not want the C runtime's `crtbegin.o` /
    # `crtend.o` (they emit `.init` / `.fini` constructors that the xtensa
    # assembler can't relocate without `l32r` literals — every link without
    # this flag dies with three `dangerous relocation: l32r: literal placed
    # after use` errors). `-nodefaultlibs` (below, set by rustc) removes
    # libc itself but keeps the crt startup objects; `-nostartfiles` drops
    # those too.
    "-C", "link-arg=-nostartfiles",
    # Recent nightly turned `panic_immediate_abort` from a build-std feature
    # into a real panic strategy; opt into it here so the `-Z build-std`
    # rebuild of `core` produces abort semantics (smaller binary, no unwinder).
    "-Z", "unstable-options",
    "-C", "panic=immediate-abort",
]

[unstable]
build-std = ["alloc", "core"]

[env]
ESP_LOG = "info"
