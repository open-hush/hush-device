name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Host-side checks: format and (eventually) tests on the parts of the code
  # that compile with the `mock-hardware` feature. RUSTUP_TOOLCHAIN=stable
  # overrides rust-toolchain.toml (which pins `esp`) so cargo doesn't try
  # to switch to a toolchain that isn't installed here.
  host-checks:
    name: fmt + host tests
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust (host only)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      # TODO(phase-1): re-enable once mock-hardware shims compile cleanly.
      # - name: Host tests
      #   run: cargo test --features mock-hardware --target x86_64-unknown-linux-gnu

  # Full firmware build for the Xtensa target. The esp-rs xtensa-toolchain
  # action installs the Espressif Rust fork and sets the env so the
  # `esp` channel from rust-toolchain.toml resolves correctly. Allowed to
  # fail until phase 1 wires up the bring-up code end to end.
  esp-build:
    name: esp build (xtensa-esp32s3)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install esp toolchain
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-esp-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: cargo check
        run: cargo check --release --target xtensa-esp32s3-none-elf
